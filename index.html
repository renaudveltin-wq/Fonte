<style>
  :root{
    --bg:#141414;
    --surface:#1D1D1E;
    --surface-raised:#242425;
    --border:#323234;
    --text:#F2EFE9;
    --text-dim:#98968f;
    --text-faint:#5f5e5c;
    --accent:#E8481C;
    --accent-dim:rgba(232,72,28,0.14);
    --accent-2:#4A7A93;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, rgba(232,72,28,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
    position:relative;
  }

  header{
    padding:calc(22px + env(safe-area-inset-top)) 18px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
  }
  .plate-logo{width:30px;height:30px;flex:none;}
  header h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:2px;
    margin:0;
  }
  header .sub{
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-top:1px;
  }

  main{flex:1; padding:18px; display:none;}
  main.active{display:block;}

  .label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 8px 2px;
  }

  .field{margin-bottom:16px;}
  input[type="text"], input[type="number"]{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:14px 14px;
    outline:none;
  }
  input::placeholder{color:var(--text-faint);}
  input:focus{border-color:var(--accent);}
  .row{display:flex; gap:10px;}
  .row .field{flex:1;}

  .add-set-btn{
    width:100%;
    background:var(--surface-raised);
    border:1px dashed var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:14px;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .add-set-btn:active{background:var(--accent-dim); border-color:var(--accent);}

  .sets-list{margin:14px 0; display:flex; flex-direction:column; gap:8px;}
  .set-chip{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:10px 12px;
  }
  .set-chip .num{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    color:var(--text-dim);
    width:20px;
  }
  .set-chip .data{
    flex:1;
    font-family:'Oswald',sans-serif;
    font-size:16px;
    letter-spacing:0.5px;
  }
  .set-chip .data .w{color:var(--accent-2); font-weight:600;}
  .set-chip .rm{
    background:none;border:none;color:var(--text-faint);
    font-size:18px; cursor:pointer; padding:2px 6px;
    line-height:1;
  }

  .save-entry-btn{
    width:100%;
    background:var(--accent);
    border:none;
    border-radius:var(--radius);
    color:#fff;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:15px;
    padding:16px;
    margin-top:6px;
    cursor:pointer;
  }
  .save-entry-btn:disabled{background:var(--surface-raised); color:var(--text-faint); cursor:not-allowed;}

  .toast{
    position:fixed;
    bottom:calc(90px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-raised);
    border:1px solid var(--accent);
    color:var(--text);
    padding:11px 18px;
    border-radius:8px;
    font-size:14px;
    opacity:0;
    transition:all .25s ease;
    pointer-events:none;
    white-space:nowrap;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .search-wrap{margin-bottom:18px;}
  .date-group{margin-bottom:22px;}
  .date-heading{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px 2px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .entry-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .entry-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    cursor:pointer;
  }
  .entry-title{font-weight:600; font-size:15px;}
  .entry-meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .entry-right{display:flex; align-items:center; gap:10px;}
  .entry-badge{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    background:var(--accent-dim);
    color:var(--accent);
    padding:4px 9px;
    border-radius:20px;
    font-weight:600;
    white-space:nowrap;
  }
  .chevron{color:var(--text-faint); font-size:12px; transition:transform .2s;}
  .entry-card.open .chevron{transform:rotate(180deg);}
  .entry-detail{
    display:none;
    padding:0 14px 14px;
    border-top:1px solid var(--border);
  }
  .entry-card.open .entry-detail{display:block; padding-top:12px;}
  .detail-sets{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .detail-set{
    font-family:'Oswald',sans-serif;
    font-size:12.5px;
    background:var(--surface-raised);
    border:1px solid var(--border);
    padding:5px 9px;
    border-radius:6px;
  }
  .detail-set .w{color:var(--accent-2);}
  .del-entry{
    background:none; border:none; color:var(--text-faint);
    font-size:12px; text-transform:uppercase; letter-spacing:1px;
    cursor:pointer; padding:4px 0;
  }
  .del-entry:active{color:var(--accent);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  .empty-state .plate-logo{width:44px; height:44px; margin:0 auto 16px; opacity:0.5;}
  .empty-state p{font-size:14px; line-height:1.5; margin:0 0 18px;}
  .empty-cta{
    background:none; border:1px solid var(--accent); color:var(--accent);
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1px;
    text-transform:uppercase; font-size:13px; padding:10px 20px;
    border-radius:8px; cursor:pointer;
  }

  .install-banner{
    margin:0 18px 0;
    background:var(--surface);
    border:1px solid var(--accent);
    border-radius:var(--radius);
    padding:12px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
    display:none;
  }
  .install-banner.show{display:block;}
  .install-banner b{color:var(--text);}
  .install-banner .close-banner{
    float:right; background:none; border:none; color:var(--text-faint);
    font-size:14px; cursor:pointer; margin-left:8px;
  }

  nav.tabbar{
    position:fixed;
    bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    z-index:40;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:14px 0 12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .tab-btn svg{width:20px;height:20px;}
  .tab-btn.active{color:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="plate-logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-label="Haltère">
      <rect x="3" y="14" width="5" height="12" rx="1.5" fill="#E8481C"/>
      <rect x="8" y="10" width="5" height="20" rx="1.5" fill="#E8481C"/>
      <rect x="13" y="18" width="14" height="4" rx="2" fill="#E8481C"/>
      <rect x="27" y="10" width="5" height="20" rx="1.5" fill="#E8481C"/>
      <rect x="32" y="14" width="5" height="12" rx="1.5" fill="#E8481C"/>
    </svg>
    <div>
      <h1>BJSS Strong Bodies</h1>
      <div class="sub">Journal de musculation</div>
    </div>
  </header>

  <div class="install-banner" id="install-banner">
    <button class="close-banner" id="close-banner">✕</button>
    <b>Astuce :</b> ajoute BJSS Strong Bodies à ton écran d'accueil pour l'ouvrir comme une vraie appli (menu Partager → « Sur l'écran d'accueil »).
  </div>

  <main id="tab-log" class="active">
    <div class="label">Machine / exercice</div>
    <div class="field">
      <input type="text" id="machine-input" list="machines-list" placeholder="Ex. Développé couché, Presse à cuisses...">
      <datalist id="machines-list"></datalist>
    </div>

    <div class="label">Ajouter une série</div>
    <div class="row">
      <div class="field">
        <input type="number" id="reps-input" placeholder="Répétitions" inputmode="numeric" min="0">
      </div>
      <div class="field">
        <input type="number" id="weight-input" placeholder="Poids kg (optionnel)" inputmode="decimal" step="0.5" min="0">
      </div>
    </div>
    <button class="add-set-btn" id="add-set-btn">+ Ajouter la série</button>

    <div class="sets-list" id="sets-list"></div>
    <button class="add-set-btn" id="add-exercise-btn" disabled>+ Ajouter cet exercice à la séance</button>
    <div class="label" style="margin-top:22px">Exercices de la séance</div>
    <div class="sets-list" id="exercises-list"></div>
    <button class="save-entry-btn" id="save-entry-btn" disabled>Enregistrer la séance</button>
    <button class="add-set-btn" id="cancel-edit-btn" style="display:none;margin-top:10px">Annuler la modification</button>
  </main>

  <main id="tab-history">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Rechercher une machine...">
    </div>
    <div id="history-content"></div>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Séance
    </button>
    <button class="tab-btn" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>
      Historique
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
const STORAGE_KEY='fonte-workout-log';
let log=[], currentSets=[], currentExercises=[], editingId=null;
const $=id=>document.getElementById(id);
function escapeHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function saveLog(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(log));}catch(e){showToast('Erreur de sauvegarde');}}
function loadLog(){try{log=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch(e){log=[];}
  // Migration automatique de l'ancien format: une ancienne entrée devient une séance à un exercice.
  log=log.map(x=>x.exercises?x:{id:x.id,timestamp:x.timestamp,dateISO:x.dateISO,exercises:[{machine:x.machine,sets:x.sets||[]} ]});
  saveLog(); renderMachinesList(); renderHistory();
}
(function(){const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const dismissed=localStorage.getItem('fonte-banner-dismissed')==='1';if(!standalone&&!dismissed)$('install-banner').classList.add('show');$('close-banner').onclick=()=>{$('install-banner').classList.remove('show');localStorage.setItem('fonte-banner-dismissed','1');};})();
document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('main').forEach(m=>m.classList.remove('active'));btn.classList.add('active');$('tab-'+btn.dataset.tab).classList.add('active');if(btn.dataset.tab==='history')renderHistory();});
function goToLogTab(){document.querySelector('.tab-btn[data-tab="log"]').click();}
function renderSets(){const c=$('sets-list');c.innerHTML=currentSets.map((s,i)=>`<div class="set-chip"><div class="num">${i+1}</div><div class="data">${s.reps} reps ${s.weight!=null?`<span class="w">· ${s.weight} kg</span>`:''}</div><button class="rm" data-i="${i}">✕</button></div>`).join('');c.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{currentSets.splice(+b.dataset.i,1);renderSets();updateButtons();});}
function renderExercises(){const c=$('exercises-list');if(!currentExercises.length){c.innerHTML='<div style="color:var(--text-faint);font-size:14px">Aucun exercice ajouté.</div>';return;}c.innerHTML=currentExercises.map((e,i)=>`<div class="set-chip"><div class="num">${i+1}</div><div class="data"><b>${escapeHtml(e.machine)}</b><br><span style="font-size:12px">${e.sets.length} série${e.sets.length>1?'s':''}</span></div><button class="rm" data-i="${i}">✕</button></div>`).join('');c.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{currentExercises.splice(+b.dataset.i,1);renderExercises();updateButtons();});}
function updateButtons(){const machine=$('machine-input').value.trim();$('add-exercise-btn').disabled=!(machine&&currentSets.length);$('save-entry-btn').disabled=!currentExercises.length;}
$('add-set-btn').onclick=()=>{const reps=parseInt($('reps-input').value), w=$('weight-input').value;if(!reps||reps<=0){$('reps-input').focus();return;}currentSets.push({reps,weight:w!==''?parseFloat(w):null});renderSets();updateButtons();$('reps-input').select();};
$('machine-input').oninput=updateButtons;
$('add-exercise-btn').onclick=()=>{const machine=$('machine-input').value.trim();if(!machine||!currentSets.length)return;currentExercises.push({machine,sets:currentSets.map(x=>({...x}))});currentSets=[];$('machine-input').value='';$('reps-input').value='';$('weight-input').value='';renderSets();renderExercises();updateButtons();renderMachinesList();showToast('Exercice ajouté ✓');};
function resetForm(){currentSets=[];currentExercises=[];editingId=null;$('machine-input').value='';$('reps-input').value='';$('weight-input').value='';$('save-entry-btn').textContent='Enregistrer la séance';$('cancel-edit-btn').style.display='none';renderSets();renderExercises();updateButtons();}
$('save-entry-btn').onclick=()=>{if(!currentExercises.length)return;const now=Date.now();if(editingId){const idx=log.findIndex(x=>x.id===editingId);if(idx>=0)log[idx]={...log[idx],exercises:currentExercises.map(e=>({machine:e.machine,sets:e.sets.map(s=>({...s}))}))};showToast('Séance modifiée ✓');}else{log.push({id:String(now),timestamp:now,dateISO:new Date(now).toISOString(),exercises:currentExercises.map(e=>({machine:e.machine,sets:e.sets.map(s=>({...s}))}))});showToast('Séance enregistrée ✓');}saveLog();resetForm();renderMachinesList();renderHistory();};
$('cancel-edit-btn').onclick=resetForm;
function editSession(id){const e=log.find(x=>x.id===id);if(!e)return;editingId=id;currentExercises=e.exercises.map(x=>({machine:x.machine,sets:x.sets.map(s=>({...s}))}));currentSets=[];$('save-entry-btn').textContent='Enregistrer les modifications';$('cancel-edit-btn').style.display='block';renderSets();renderExercises();updateButtons();goToLogTab();showToast('Séance chargée pour modification');}
function renderMachinesList(){const names=[...new Set(log.flatMap(s=>s.exercises||[]).map(e=>e.machine).concat(currentExercises.map(e=>e.machine)))].sort();$('machines-list').innerHTML=names.map(n=>`<option value="${escapeHtml(n)}">`).join('');}
function formatDateHeading(ts){const d=new Date(ts),t=new Date(),y=new Date();y.setDate(t.getDate()-1);const same=(a,b)=>a.toDateString()===b.toDateString();if(same(d,t))return "Aujourd'hui";if(same(d,y))return 'Hier';return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function normalizeExerciseName(name){return (name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function isAssistedExercise(name){const n=normalizeExerciseName(name);return n.includes('dip assist')||n.includes('dips assist')||n.includes('chin assist');}
function isPushUpExercise(name){const n=normalizeExerciseName(name);return n.includes('pompe');}
function recordsHtml(){
  const rec={};
  log.forEach(s=>(s.exercises||[]).forEach(e=>e.sets.forEach(set=>{
    const key=e.machine;
    if(isPushUpExercise(key)){
      if(rec[key]==null||set.reps>rec[key].value)rec[key]={value:set.reps,type:'reps'};
      return;
    }
    if(set.weight==null)return;
    const assisted=isAssistedExercise(key);
    if(rec[key]==null||(assisted?set.weight<rec[key].value:set.weight>rec[key].value))rec[key]={value:set.weight,type:'weight'};
  })));
  const rows=Object.entries(rec).sort((a,b)=>a[0].localeCompare(b[0]));
  if(!rows.length)return '';
  return `<div class="date-group"><div class="date-heading">🏆 Records</div>${rows.map(([m,r])=>{
    const note=isPushUpExercise(m)?'<div style="font-size:11px;opacity:.65;margin-top:2px">record = maximum de répétitions sur une série</div>':(isAssistedExercise(m)?'<div style="font-size:11px;opacity:.65;margin-top:2px">moins d’assistance = meilleur record</div>':'');
    const display=r.type==='reps'?`${r.value} reps`:`${r.value} kg`;
    return `<div class="set-chip"><div class="data"><b>${escapeHtml(m)}</b>${note}</div><div class="w" style="margin-left:auto;font-weight:700">${display}</div></div>`;
  }).join('')}</div>`;
}
function renderHistory(){const c=$('history-content'),f=($('search-input').value||'').trim().toLowerCase();const filtered=log.filter(s=>!f||(s.exercises||[]).some(e=>e.machine.toLowerCase().includes(f))).sort((a,b)=>b.timestamp-a.timestamp);if(!filtered.length){c.innerHTML=recordsHtml()+`<div class="empty-state"><p>${log.length?'Aucun résultat pour cette recherche.':'Aucune séance enregistrée pour l\'instant.'}</p></div>`;return;}const groups=[];filtered.forEach(e=>{const key=new Date(e.timestamp).toDateString();let g=groups.find(x=>x.key===key);if(!g){g={key,heading:formatDateHeading(e.timestamp),entries:[]};groups.push(g);}g.entries.push(e);});c.innerHTML=recordsHtml()+groups.map(g=>`<div class="date-group"><div class="date-heading">${g.heading}</div>${g.entries.map(entryCardHtml).join('')}</div>`).join('');c.querySelectorAll('.entry-head').forEach(h=>h.onclick=()=>h.closest('.entry-card').classList.toggle('open'));c.querySelectorAll('.edit-entry').forEach(b=>b.onclick=ev=>{ev.stopPropagation();editSession(b.dataset.id);});c.querySelectorAll('.del-entry').forEach(b=>b.onclick=ev=>{ev.stopPropagation();if(confirm('Supprimer cette séance ?')){log=log.filter(e=>e.id!==b.dataset.id);saveLog();renderMachinesList();renderHistory();}});}
function entryCardHtml(e){const ex=e.exercises||[];const totalSets=ex.reduce((n,x)=>n+x.sets.length,0);return `<div class="entry-card"><div class="entry-head"><div><div class="entry-title">${ex.length} exercice${ex.length>1?'s':''}</div><div class="entry-meta">${totalSets} séries au total</div></div><div class="entry-right"><div class="entry-badge">${ex.length} ex.</div><div class="chevron">▾</div></div></div><div class="entry-detail"><div class="detail-sets">${ex.map(x=>`<div style="margin-bottom:12px"><b>${escapeHtml(x.machine)}</b>${x.sets.map((s,i)=>`<div class="detail-set">S${i+1} · ${s.reps} reps${s.weight!=null?` <span class="w">· ${s.weight}kg</span>`:''}</div>`).join('')}</div>`).join('')}</div><button class="add-set-btn edit-entry" data-id="${e.id}" style="margin-top:10px">Modifier cette séance</button><button class="del-entry" data-id="${e.id}">Supprimer cette séance</button></div></div>`;}
$('search-input').oninput=renderHistory;
renderExercises();loadLog();
</script>
</body>
</html>
